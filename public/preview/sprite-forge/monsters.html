<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mythic enemy picks</title>
    <style>
      :root {
        --bg: #0b0b0d;
        --panel: #16141a;
        --line: #3a342c;
        --text: #f3ece3;
        --muted: #a89888;
        --gold: #e8c878;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      body {
        padding: 20px 20px 40px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }
      p {
        color: var(--muted);
        max-width: 44rem;
        line-height: 1.45;
        margin: 0 0 22px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .card {
        flex: 1 1 240px;
        max-width: 340px;
        min-height: 44px;
        margin: 0;
        padding: 12px;
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 16px;
        color: inherit;
        cursor: pointer;
        text-align: left;
      }
      .card:focus,
      .card.picked {
        border-color: var(--gold);
        outline: 3px solid var(--gold);
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
        background: #1a1020;
        border-radius: 10px;
      }
      .card strong {
        display: block;
        margin: 10px 0 4px;
        font-size: 1.2rem;
      }
      a {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <h1>Mythic try-ons</h1>
    <p>
      Painted mythic roster. Not in the live game. Click any you like (gold border). Humans are
      parked on <a href="./raider.html">the raider page</a>.
    </p>
    <div class="row">
      <button type="button" class="card" data-id="goblin">
        <img src="./monsters/goblin/clean.png" alt="Goblin" />
        <strong>Goblin</strong>
      </button>
      <button type="button" class="card" data-id="orc">
        <img src="./monsters/orc/clean.png" alt="Orc" />
        <strong>Orc</strong>
      </button>
      <button type="button" class="card" data-id="troll">
        <img src="./monsters/troll/clean.png" alt="Troll" />
        <strong>Troll</strong>
      </button>
      <button type="button" class="card" data-id="ghoul">
        <img src="./monsters/ghoul/clean.png" alt="Ghoul" />
        <strong>Ghoul</strong>
      </button>
      <button type="button" class="card" data-id="gnome">
        <img src="./monsters/gnome/clean.png" alt="Evil gnome" />
        <strong>Gnome</strong>
      </button>
      <button type="button" class="card" data-id="wyvern">
        <img src="./monsters/wyvern/clean.png" alt="Wyvern" />
        <strong>Wyvern</strong>
      </button>
      <button type="button" class="card" data-id="imp">
        <img src="./monsters/imp/clean.png" alt="Imp" />
        <strong>Imp</strong>
      </button>
      <button type="button" class="card" data-id="warg">
        <img src="./monsters/warg/clean.png" alt="Warg" />
        <strong>Warg</strong>
      </button>
      <button type="button" class="card" data-id="warlord">
        <img src="./monsters/warlord/clean.png" alt="Warlord" />
        <strong>Warlord</strong>
      </button>
      <button type="button" class="card" data-id="ogre">
        <img src="./monsters/ogre/clean.png" alt="Ogre" />
        <strong>Ogre</strong>
      </button>
      <button type="button" class="card" data-id="hellbat">
        <img src="./monsters/hellbat/clean.png" alt="Hellbat" />
        <strong>Hellbat</strong>
      </button>
      <button type="button" class="card" data-id="drake">
        <img src="./monsters/drake/clean.png" alt="Drake" />
        <strong>Drake</strong>
      </button>
    </div>
    <script>
      document.querySelectorAll('.card').forEach((card) => {
        card.addEventListener('click', () => card.classList.toggle('picked'));
      });
    </script>
  </body>
</html>
