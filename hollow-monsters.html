<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow monster picks</title>
    <style>
      :root {
        --bg: #0b0b0d;
        --panel: #16141a;
        --line: #3a342c;
        --text: #f3ece3;
        --muted: #a89888;
        --gold: #e8c878;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      body {
        padding: 20px 20px 160px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }
      p {
        color: var(--muted);
        max-width: 46rem;
        line-height: 1.45;
        margin: 0 0 18px;
      }
      a {
        color: var(--gold);
      }
      .kind {
        margin: 0 0 22px;
      }
      .kind h2 {
        margin: 0 0 10px;
        font-size: 1.15rem;
        color: var(--gold);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .card {
        flex: 1 1 280px;
        max-width: 420px;
        min-height: 44px;
        margin: 0;
        padding: 12px;
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 16px;
        color: inherit;
        cursor: pointer;
        text-align: left;
      }
      .card:focus,
      .card.picked {
        border-color: var(--gold);
        outline: 3px solid var(--gold);
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
        background: #1a1020;
        border-radius: 10px;
      }
      .card strong {
        display: block;
        margin: 10px 0 0;
        font-size: 1.1rem;
      }
      .tray {
        position: sticky;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 14px 20px;
        background: #120e0c;
        border-top: 3px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .tray button {
        min-height: 48px;
        padding: 10px 18px;
        border-radius: 12px;
        border: 3px solid var(--gold);
        background: #3a2a14;
        color: var(--text);
        font-size: 1rem;
        cursor: pointer;
      }
      #picks {
        flex: 1 1 220px;
        color: var(--muted);
        margin: 0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Hollow monster try-ons</h1>
    <p>
      Shade, Hex Knight, Hex Warden, The Magician. Not in the live match until you pick.
      Click <strong>A or B</strong> for each body, then Copy picks and paste that in chat.
    </p>
    <div id="kinds"></div>
    <div class="tray">
      <p id="picks">No picks yet.</p>
      <button type="button" id="copy">Copy picks</button>
    </div>
    <script>
      const KINDS = [
        { id: 'shade', name: 'Shade', a: 'Hex wraith', b: 'Void moth' },
        { id: 'hexknight', name: 'Hex Knight', a: 'Rune plate', b: 'Chitin plate' },
        { id: 'hexwarden', name: 'Hex Warden', a: 'Ward-disk keeper', b: 'Rune lantern' },
        { id: 'magician', name: 'The Magician', a: 'Hooded void mage', b: 'Hex-gate archon' },
      ];
      const picks = {};
      const root = document.getElementById('kinds');
      const picksEl = document.getElementById('picks');

      function renderPicks() {
        const lines = KINDS.map((k) => {
          const p = picks[k.id];
          return p ? `${k.name}: ${p.toUpperCase()}` : `${k.name}: —`;
        });
        picksEl.textContent = lines.join('\n');
      }

      KINDS.forEach((kind) => {
        const wrap = document.createElement('section');
        wrap.className = 'kind';
        wrap.innerHTML = `<h2>${kind.name}</h2><div class="row"></div>`;
        const row = wrap.querySelector('.row');
        ['a', 'b'].forEach((opt) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card';
          btn.dataset.kind = kind.id;
          btn.dataset.opt = opt;
          btn.innerHTML = `<img src="/preview/sprite-forge/world-monsters/${kind.id}/${opt}/clean.png" alt="${kind.name} ${opt}" /><strong>${opt.toUpperCase()} — ${kind[opt]}</strong>`;
          btn.addEventListener('click', () => {
            picks[kind.id] = opt;
            row.querySelectorAll('.card').forEach((c) => c.classList.toggle('picked', c.dataset.opt === opt));
            renderPicks();
          });
          row.append(btn);
        });
        root.append(wrap);
      });

      document.getElementById('copy').addEventListener('click', async () => {
        await navigator.clipboard.writeText(picksEl.textContent);
        document.getElementById('copy').textContent = 'Copied';
      });
      renderPicks();
    </script>
  </body>
</html>
